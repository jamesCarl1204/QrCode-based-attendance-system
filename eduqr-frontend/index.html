<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A QR code-based attendance monitoring system for schools. Manage student attendance, class sessions, and attendance records through dedicated student, teacher, and admin portals." />
    <meta name="keywords" content="QR code attendance system, QR attendance, student attendance monitoring system, school attendance system, online attendance management, teacher attendance portal, student attendance records" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#101827" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="QR Code-Based Attendance Monitoring System" />
    <meta property="og:description" content="Manage school attendance, class sessions, and student records with a QR code-based attendance monitoring system." />
    <meta property="og:image" content="/100.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QR Code-Based Attendance Monitoring System" />
    <meta name="twitter:description" content="A school attendance monitoring system with QR code attendance and student, teacher, and admin portals." />

    <link rel="icon" type="image/png" href="/100.png" />
    <title>QR Code Attendance System for Schools | Attendance Monitoring</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "QR Code-Based Attendance Monitoring System",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "A web-based school attendance monitoring system that uses QR codes to support student attendance tracking, class session management, and attendance records for students, teachers, and administrators."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('eduqr_theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
